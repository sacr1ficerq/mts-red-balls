# Note: API key and per-agent model settings are managed via SettingsManager
# and stored in backend/data/settings.json
# Use the Settings API endpoints to configure:
#   - GET/PUT /api/settings - Manage API key and agent models
#   - GET /api/settings/models - List available models

llm:
  # Default model (overridden by SettingsManager per-agent config)
  model: "xiaomi/mimo-v2-flash"
  temperature: 0.7
  max_tokens: 4096
  max_retries: 5
  retry_delay: 5.0
  requests_per_minute: 30

sandbox:
  root: "./workspace"
  timeout: 120

agents:
  timeout: 1800  # Maximum execution time in seconds (30 minutes)
  allowed_commands:
    - python
    - python3
    - pip
    - pip3
    - ls
    - cat
    - head
    - tail
    - grep
    - find
    - mkdir
    - rm
    - rmdir
    - cp
    - mv
    - curl
    - wget
    - tar
    - unzip
    - zip
    - chmod
    - chown
    - echo
    - pwd
    - whoami
    - date
    - time
    - touch
    - which
    - cd
    - exit
    - docker
    - node
    - npm
    - npx

agents:
  Coordinator:
    role: "Plan and delegate tasks to solve the user's request"
    tools: ["delegate", "message", "tool"]
    max_iterations: 20
  CodeAgent:
    role: "Write and execute Python code in sandbox"
    tools: ["console", "files", "pip_install"]
    max_iterations: 50

search:
  model: "z-ai/glm-4.5-air"
  max_results: 8
  relevance_filter: true

rag:
  chunk_size: 500
  overlap: 50
  top_k: 5

server:
  host: "0.0.0.0"
  port: 8000
  cors_origins: ["*"]

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/server.log"
