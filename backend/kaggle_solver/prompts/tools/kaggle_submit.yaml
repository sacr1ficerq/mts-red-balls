name: kaggle_submit
description: |
  Submit predictions to a Kaggle competition. The submission file must match the required format 
  (use kaggle_validate_submission to check before submitting). Include a descriptive message to 
  track different submissions. Be aware of daily submission limits.

parameters:
  query:
    type: string
    required: true
    description: Competition name (e.g., 'titanic', 'house-prices-advanced-regression-techniques')
  submission_file:
    type: string
    required: true
    description: Path to submission file (CSV format)
  message:
    type: string
    required: false
    description: Submission message/description to track what this submission represents

examples:
  - query: "Submit predictions to Titanic competition"
    parameters:
      query: "titanic"
      submission_file: "submission.csv"
      message: "XGBoost with 350 trees, tuned hyperparameters"
  - query: "Submit ensemble predictions"
    parameters:
      query: "house-prices-advanced-regression-techniques"
      submission_file: "submission_ensemble.csv"
      message: "Ensemble of top 3 models"

output_format: |
  Returns a JSON object with submission information:
  {
    "status": "complete",
    "message": "XGBoost with 350 trees, tuned hyperparameters",
    "submitted_at": "2024-01-15 14:30:00",
    "submission_id": "12345678"
  }
