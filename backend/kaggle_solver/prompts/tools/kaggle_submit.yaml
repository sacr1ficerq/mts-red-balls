kaggle_submit_tool: |
  kaggle_submit: Submit a CSV file to a Kaggle competition.
  Input: query = competition name (required), submission_file = path to CSV, message = optional submission message
  Output: JSON with submission_id, status, submitted_at

  Usage:
  {"action": "tool", "tool": "kaggle_submit", "query": "titanic", "submission_file": "submission.csv", "message": "CatBoost v1 CV=0.82"}
