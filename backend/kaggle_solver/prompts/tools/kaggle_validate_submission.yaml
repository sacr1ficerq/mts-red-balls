kaggle_validate_submission_tool: |
  kaggle_validate_submission: Validate a submission CSV against the sample submission format.
  Checks: column names, row count, ID column values, missing values, data types.
  Input: query = competition name (required), submission_file = path to your CSV, sample_file = path to sample_submission.csv
  Output: validation result with list of errors (empty = valid)

  Usage:
  {"action": "tool", "tool": "kaggle_validate_submission", "query": "titanic", "submission_file": "submission.csv", "sample_file": "sample_submission.csv"}
