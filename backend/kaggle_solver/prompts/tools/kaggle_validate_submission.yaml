# kaggle_validate_submission
description: |
  Validate a submission file against a sample submission.
  Input: query (competition name), submission_file (path), sample_file (path)
  Output: validation results (success/failure and reasons)

usage: |
  {"action": "tool", "tool": "kaggle_validate_submission", "query": "titanic", "submission_file": "submission.csv", "sample_file": "gender_submission.csv"}
