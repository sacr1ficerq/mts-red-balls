plan_tool: |
  plan: Create a plan with steps for multi-step tasks. MANDATORY for tasks with 3+ steps.
  
  When to use:
  - Tasks with 3+ steps that need to be executed in sequence
  - Tasks that require different types of work (file creation, code writing, execution)
  - Tasks where you need to track progress
  - Tasks numbered as 1), 2), 3) or similar
  
  Input: plan_id (unique identifier), steps list with {id, task, agent}
  
  Available agents:
  - CodeAgent: Creates files, writes code, executes Python scripts, runs console commands
  - SearchAgent: Searches the web for information
  
  Output: none (plan is displayed to user)
  
  Usage:
  {"action": "plan", "plan_id": "1", "steps": [
    {"id": 1, "agent": "CodeAgent", "task": "Create CSV file with sales data"},
    {"id": 2, "agent": "CodeAgent", "task": "Write script to calculate total sales"},
    {"id": 3, "agent": "CodeAgent", "task": "Run the script and show result"}
  ]}
  
  After creating a plan, the system will automatically execute the first step.
  Wait for the result, then delegate the next step using the "delegate" action.

update_plan_tool: |
  update_plan: Update a specific step in the plan.
  
  When to use:
  - When you need to modify a step's task description
  - When you need to change the agent for a step
  - When a step fails and you need to adjust the approach
  
  Input: plan_id, step_id, update object with new_task and/or new_agent
  
  Output: none (plan is updated and displayed)
  
  Usage:
  {"action": "update_plan", "plan_id": "1", "update": {"step_id": 2, "task": "Updated task description"}}
  {"action": "update_plan", "plan_id": "1", "update": {"step_id": 3, "agent": "SearchAgent"}}

delegate_tool: |
  delegate: Delegate a task to a specialized agent.

  Available agents:
  - CodeAgent: Python code, file ops, console commands, ALL Kaggle tool calls
  - SearchAgent: web search + RAG knowledge base (ML techniques, feature engineering)
  - CriticAgent: code review, bug detection, quality check
  - DataParser: parse data files, profile columns, publish data_profile artifact
  - DataPreprocessor: EDA, cleaning, scaling, encoding
  - FeatureEngineer: create new features; reads data_profile artifact
  - HypothesisGenerator: generate ranked ML hypotheses; reads data_profile artifact
  - ModelTrainer: train CatBoost models; reads features_train_path artifact
  - KaggleSubmitter: validate + submit predictions; reads submission_file_path artifact

  Optional: pass context_ids to share prior event results with the sub-agent.

  Usage:
  {"action": "delegate", "agent": "CodeAgent", "task": "write hello world"}
  {"action": "delegate", "agent": "DataParser", "task": "profile train.csv", "context_ids": [3, 7]}

result_tool: |
  done: Return final result to user.
  
  When to use:
  - After completing all steps of a plan
  
  Input: final answer in user's language
  
  Output: none (result is displayed to user)
  
  Usage:
  {"action": "done", "result": "your answer"}
  
  CRITICAL: ALWAYS use "done" to return your final answer - never just write text without the action.
