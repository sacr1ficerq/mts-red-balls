kaggle_prepare_submission_tool: |
  kaggle_prepare_submission: Reformat raw predictions into the competition submission format.
  Aligns predictions with sample_submission.csv (correct ID column, column names, row order).
  Input: query = competition name (required), predictions_file = CSV with raw predictions, sample_file = sample_submission.csv, output_file = where to save
  Output: path to the prepared submission file

  Usage:
  {"action": "tool", "tool": "kaggle_prepare_submission", "query": "titanic", "predictions_file": "predictions.csv", "sample_file": "sample_submission.csv", "output_file": "submission.csv"}
