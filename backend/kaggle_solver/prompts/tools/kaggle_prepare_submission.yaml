# kaggle_prepare_submission
description: |
  Prepare a submission file from predictions.
  Input: query (competition name), predictions_file (path), sample_file (path)
  Output: path to the prepared submission file

usage: |
  {"action": "tool", "tool": "kaggle_prepare_submission", "query": "titanic", "predictions_file": "preds.csv", "sample_file": "gender_submission.csv"}
