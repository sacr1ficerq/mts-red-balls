kaggle_get_submission_status_tool: |
  kaggle_get_submission_status: Get the score and status of the latest (or specific) submission.
  Input: query = competition name; optional submission_id
  Output: JSON with status, public_score, submitted_at, message

  Usage:
  {"action": "tool", "tool": "kaggle_get_submission_status", "query": "titanic"}
  {"action": "tool", "tool": "kaggle_get_submission_status", "query": "titanic", "submission_id": "12345678"}
