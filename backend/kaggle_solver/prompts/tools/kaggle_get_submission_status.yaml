name: kaggle_get_submission_status
description: |
  Get the status and score of a submitted prediction. Use this to check if a submission has been
  scored and to retrieve the public score. The private score is only available after the competition ends.
  If submission_id is not provided, returns the latest submission status.

parameters:
  query:
    type: string
    required: true
    description: Competition name (e.g., 'titanic', 'house-prices-advanced-regression-techniques')
  submission_id:
    type: string
    required: false
    description: Submission ID returned by kaggle_submit. If not provided, returns the latest submission.

examples:
  - query: "Check status of my latest submission"
    parameters:
      query: "titanic"
      submission_id: ""
  - query: "Check status of submission 12345678"
    parameters:
      query: "titanic"
      submission_id: "12345678"

output_format: |
  Returns a JSON object with submission status:
  {
    "status": "complete",
    "public_score": 0.78947,
    "private_score": null,
    "submitted_at": "2024-01-15 14:30:00",
    "message": "XGBoost with 350 trees, tuned hyperparameters"
  }
