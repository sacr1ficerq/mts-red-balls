# Tool definitions
# Important: Use tool once, then wait for result. After result, output next action or done.

description: |
  Read and write files in sandbox.
  Input: operation (read/write), path, content (for write), limit (for read)
  - limit: "100" (default, 100 lines), "all" (up to 30K chars), or number of lines
  Output: success message or file content (for read)

usage: |
  {"action": "tool", "tool": "files", "op": "write", "path": "script.py", "content": "print('hello')"}
  # Wait for "File written successfully"...
  {"action": "tool", "tool": "files", "op": "read", "path": "script.py", "limit": "30"}
  # Wait for file content (first 100 lines)...
  {"action": "tool", "tool": "files", "op": "read", "path": "data.csv", "limit": "all"}
  # For large files, use limit="all" (max 30K chars)
  {"action": "done", "result": "done"}
