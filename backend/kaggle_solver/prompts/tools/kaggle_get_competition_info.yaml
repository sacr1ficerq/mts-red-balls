kaggle_get_competition_info_tool: |
  kaggle_get_competition_info: Get competition details (title, metric, deadline, submission limits).
  Input: query = competition name (e.g. "titanic")
  Output: JSON with name, title, evaluation_metric, max_daily_submissions, deadline

  Usage:
  {"action": "tool", "tool": "kaggle_get_competition_info", "query": "titanic"}
