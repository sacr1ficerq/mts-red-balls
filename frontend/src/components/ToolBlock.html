<!-- ToolBlock.html - Tool execution -->
<div class="flex gap-4 group">
    <div class="flex-shrink-0 mt-1">
        <div class="w-6 h-6 rounded-full bg-amber-50 flex items-center justify-center border border-amber-200">
            <i class="fas text-[10px]" :class="{
                'fa-search text-blue-600': event.data.tool_name === 'search',
                'fa-terminal text-amber-600': event.data.tool_name === 'console',
                'fa-file-code text-green-600': event.data.tool_name === 'files'
            }"></i>
        </div>
    </div>
    <div class="flex-1 min-w-0">
        <div class="bg-white border border-amber-100 rounded-lg shadow-sm overflow-hidden">
            <div class="px-3 py-2 bg-amber-50/30 flex justify-between items-center cursor-pointer hover:bg-amber-50/50 transition-colors"
                 @click="toggleEvent(currentSessionId, index)">
                <div class="flex items-center gap-2">
                    <span class="text-xs font-bold text-amber-700 font-mono" x-text="event.data.tool_name"></span>
                    <span class="px-1.5 py-0.5 rounded text-[9px] font-medium bg-amber-100 text-amber-700" x-text="getAgentDisplayName(event.agent)"></span>
                    <span x-show="event.data.success === false" class="px-1.5 py-0.5 rounded text-[9px] font-medium bg-red-100 text-red-700">ОШИБКА</span>
                </div>
                <i class="fas text-[10px] text-amber-400 transition-transform" 
                   :class="event.expanded ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
            </div>
            <div x-show="event.expanded" class="p-0">
                <div class="border-b border-amber-50 p-3 bg-gray-50">
                    <div class="text-[10px] font-bold text-gray-400 uppercase mb-2">Параметры</div>
                    <div class="bg-white rounded-lg p-2 border border-gray-200" x-html="formatToolInput(event.data.input)"></div>
                </div>
                <div class="p-3" x-show="event.data.output">
                    <div class="text-[10px] font-bold text-gray-400 uppercase mb-2">Результат</div>
                    <div class="bg-white rounded-lg p-3 border border-gray-200 text-xs text-gray-800 max-h-60 overflow-y-auto custom-scrollbar" x-html="formatToolOutput(event.data.output, event.data.tool_name)"></div>
                </div>
            </div>
        </div>
    </div>
</div>
