<!-- DelegateBlock.html - Agent delegation -->
<div class="flex gap-4 group">
    <div class="flex-shrink-0 mt-1">
        <div class="w-6 h-6 rounded-full bg-purple-50 flex items-center justify-center border border-purple-200">
            <i class="fas fa-share-alt text-[10px] text-purple-600"></i>
        </div>
    </div>
    <div class="flex-1 min-w-0">
        <div class="bg-white border border-purple-100 rounded-lg shadow-sm overflow-hidden">
            <div class="px-3 py-2 bg-purple-50/30 flex justify-between items-center cursor-pointer hover:bg-purple-50/50 transition-colors"
                 @click="toggleEvent(currentSessionId, index)">
                <div class="flex items-center gap-2">
                    <span class="text-xs font-bold text-purple-700">Делегирование</span>
                    <span class="px-1.5 py-0.5 rounded text-[9px] font-medium bg-purple-100 text-purple-700" x-text="getAgentDisplayName(event.data.target_agent)"></span>
                </div>
                <i class="fas text-[10px] text-purple-400 transition-transform" 
                   :class="event.expanded ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
            </div>
            <div x-show="event.expanded" class="p-3">
                <div class="text-[10px] font-bold text-gray-400 uppercase mb-1">Задача</div>
                <div class="text-xs text-gray-700" x-text="event.data.task"></div>
            </div>
        </div>
    </div>
</div>
