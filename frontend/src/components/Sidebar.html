<!-- Sidebar Component -->
<div class="flex flex-col h-full bg-white border-r border-gray-200 w-64 flex-shrink-0">
    <!-- Header -->
    <div class="px-4 py-3 border-b border-gray-100 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-red-500 to-red-600 flex items-center justify-center shadow-sm">
                <i class="fas fa-brain text-white text-sm"></i>
            </div>
            <span class="font-bold text-gray-800 text-sm">МТС Агент</span>
        </div>
    </div>

    <!-- Session History -->
    <div class="flex-1 overflow-y-auto px-2 py-2 space-y-1 custom-scrollbar">
        <div x-show="sidebarOpen" class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1 px-2 mt-2 flex items-center gap-2">
            Активные
        </div>
        <template x-for="session in sortedActiveSessions" :key="session.id">
            <div @click="selectSession(session.id)"
                 class="cursor-pointer px-3 py-2 rounded-md transition-colors duration-200 flex items-center gap-2 group"
                 :class="currentSessionId === session.id ? 'bg-red-50 text-red-700' : 'hover:bg-gray-50 text-gray-600'">
                <div class="flex-shrink-0 w-1.5 h-1.5 rounded-full" 
                     :class="currentSessionId === session.id ? 'bg-red-500' : 'bg-emerald-500'"></div>
                <div class="truncate text-xs font-medium" x-show="sidebarOpen" x-text="session.task || 'Новая задача'"></div>
            </div>
        </template>

        <div x-show="sidebarOpen" class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1 px-2 mt-4 flex items-center gap-2">
            История
        </div>
        <template x-for="session in sortedHistoricalSessions" :key="session.id">
            <div @click="selectSession(session.id)"
                 class="cursor-pointer px-3 py-2 rounded-md transition-colors duration-200 flex items-center gap-2 group"
                 :class="currentSessionId === session.id ? 'bg-gray-100 text-gray-900' : 'hover:bg-gray-50 text-gray-500'">
                <i class="fas fa-history text-[10px] flex-shrink-0 opacity-50"></i>
                <div class="truncate text-xs" x-show="sidebarOpen" x-text="session.task || 'Без названия'"></div>
            </div>
        </template>
    </div>

    <!-- File Structure -->
    <div x-show="sidebarOpen" class="border-t border-gray-100 bg-gray-50 flex-shrink-0" style="height: 180px; overflow: hidden;" x-data="{ selectedFile: null, fileContent: '', loading: false }">
        <div class="px-3 py-2 flex items-center justify-between cursor-pointer hover:bg-gray-100 border-b border-gray-200" @click="fileTreeOpen = !fileTreeOpen">
            <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider flex items-center gap-2">
                <i class="fas fa-folder-tree"></i> Файлы
            </span>
            <i class="fas text-gray-400 text-[10px] transition-transform" :class="fileTreeOpen ? 'fa-chevron-down' : 'fa-chevron-right'"></i>
        </div>
        <div x-show="fileTreeOpen" style="height: 144px; overflow-y: auto; overflow-x: hidden;" class="px-2 pb-2 text-xs custom-scrollbar">
            <template x-if="fileTree && Object.keys(fileTree).length > 0">
                <div class="space-y-0.5">
                    <template x-for="(value, key) in fileTree" :key="key">
                        <div>
                            <div class="flex items-center gap-1.5 py-1 px-2 cursor-pointer hover:bg-gray-200 rounded-md transition-colors" 
                                 @click="if(value && Object.keys(value).length > 0) { toggleFolder(key); } else { loading=true; readFile(key).then(c => { selectedFile=key; fileContent=c; loading=false; }) }">
                                <i class="fas text-[10px]" :class="fileTreeOpenPaths[key] ? 'fa-folder-open text-amber-500' : (value && Object.keys(value).length > 0 ? 'fa-folder text-amber-500' : 'fa-file-code text-gray-400')"></i>
                                <span x-text="key" class="truncate text-gray-600"></span>
                            </div>
                            <div x-show="fileTreeOpenPaths[key]" class="pl-3 border-l border-gray-200 ml-2 mt-0.5">
                                <template x-for="(v2, k2) in value" :key="k2">
                                    <div class="flex items-center gap-1.5 py-1 px-2 cursor-pointer hover:bg-gray-200 rounded-md transition-colors"
                                         @click="loading=true; readFile(key + '/' + k2).then(c => { selectedFile=key+'/'+k2; fileContent=c; loading=false; })">
                                        <i class="fas text-[10px]" :class="v2 && Object.keys(v2).length > 0 ? 'fa-folder text-amber-500' : 'fa-file-code text-gray-400'"></i>
                                        <span x-text="k2" class="truncate text-gray-600"></span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </template>
            <template x-if="!fileTree || Object.keys(fileTree).length === 0">
                <div class="text-gray-400 text-xs px-2 py-1">Нет файлов</div>
            </template>
        </div>
    </div>
</div>
