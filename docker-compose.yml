services:
    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        ports:
            - "8000:8000"
        env_file:
            - .env
        command: uvicorn server:app --host 0.0.0.0 --port 8000 --reload
        # Configure logging to stdout
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
        # Attach to stdout/stderr
        tty: true
        stdin_open: true

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        ports:
            - "5173:5173"
        volumes:
            - ./frontend:/app
            - /app/node_modules
        environment:
            - DOCKER_ENV=true
        command: npm run dev -- --host
        # Configure logging to stdout
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
        # Attach to stdout/stderr
        tty: true
        stdin_open: true
